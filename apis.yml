aid: railway-app
url: https://raw.githubusercontent.com/api-evangelist/railway-app/refs/heads/main/apis.yml
name: Railway
kind: company
description: Railway is a cloud application deployment platform (PaaS) that builds,
  deploys, and scales services, databases, and cron jobs from a Git repository or
  Docker image. Its programmatic surface is a GraphQL-first Public API served at
  https://backboard.railway.com/graphql/v2 - the same API that powers the Railway
  dashboard. There is no REST API; all queries and mutations are issued as GraphQL
  POST requests, and real-time build, deployment, and environment log streams are
  delivered as GraphQL subscriptions over a WebSocket endpoint at
  wss://backboard.railway.com/graphql/v2.
